# Generated by std (warmbootdev/standards; version in .warmboot/std.lock). Do not
# edit: settings are in .warmboot/std.toml ([ci]); see .warmboot/README.md.
name: Standards
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: std-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    runs-on: {{runs-on}}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: std check
        env:
          STD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          STD_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          STD_PR_TITLE: ${{ github.event.pull_request.title }}
          STD_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .warmboot/std.py check --ci
