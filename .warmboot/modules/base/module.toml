description = "Every repository: editorconfig, git attributes and ignores, prettier for docs and config, conventional commits, workflow lint, secret scanning."

[checks.commits]
script = "checks/commits.sh"

# Policy, not style: blocks during rollout too, and no repository can skip it.
[checks.attribution]
script = "checks/attribution.sh"
always = true

[checks.prettier]
script = "checks/prettier.sh"

[checks.actionlint]
script = "checks/actionlint.sh"

[checks.secrets]
script = "checks/secrets.sh"
